[package]
name = "ws-framer"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Allocation-free, panic-free no_std websocket framer"
readme = "README.md"
keywords = ["websocket", "no-std", "embedded", "framer"]
repository = "https://github.com/filipton/ws-framer"

[lib]

[[example]]
name = "ws-framer-test"

[dependencies]
getrandom04 = { version = "0.4.2", package = "getrandom", optional = true }
getrandom03 = { version = "=0.3.4", package = "getrandom", optional = true }
getrandom02 = { version = "=0.2.15", package = "getrandom", optional = true }
httparse = { version = "1.10.1", default-features = false, optional = true }
itoa = { version = "1.0.18", optional = true }

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"

[features]
default = ["http", "getrandom04"]
getrandom02 = ["dep:getrandom02"]
getrandom03 = ["dep:getrandom03"]
getrandom04 = ["dep:getrandom04"]
http = ["dep:httparse", "dep:itoa"]
alloc = []
